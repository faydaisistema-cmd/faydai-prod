<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Faydai — Pesquisa de Bem-Estar no Trabalho</title>
<style>
  :root{
    --bg: #EEF2EF;
    --card: #FFFFFF;
    --ink: #24312B;
    --ink-soft: #5B6B63;
    --teal: #1F5C55;
    --teal-deep: #163F3A;
    --amber: #E3A23C;
    --amber-soft: #F6E3C2;
    --line: #DCE4DF;
    --error: #B3453A;
    --error-soft: #F5E2DF;
    --radius: 20px;
    --shadow: 0 10px 30px -12px rgba(22,63,58,0.18);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #E3EDE7 0%, var(--bg) 55%);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding: 20px;
  }
  @font-face{
    /* usa fontes do sistema por padrão; Poppins carregado via link abaixo para o título */
  }
  .app{
    width:100%;
    max-width: 460px;
  }

  /* ---------- Cabeçalho / progresso ---------- */
  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 18px;
  }
  .brand{
    font-family:"Poppins", sans-serif;
    font-weight:600;
    font-size:15px;
    color: var(--teal-deep);
    letter-spacing:0.2px;
  }
  .brand small{
    display:block;
    font-family:"Inter", sans-serif;
    font-weight:400;
    font-size:11px;
    color: var(--ink-soft);
    margin-top:1px;
  }
  .steps{
    display:flex;
    gap:6px;
  }
  .step{
    width:26px;
    height:6px;
    border-radius:4px;
    background: var(--line);
    transition: background .35s ease, transform .35s ease;
  }
  .step.done{ background: var(--teal); }
  .step.current{ background: var(--amber); transform: scaleY(1.3); }

  /* ---------- Cartão da pergunta ---------- */
  .card{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 24px 26px;
    position: relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:5px;
    background: linear-gradient(90deg, var(--teal), var(--amber));
    opacity:.9;
  }
  .dim{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    color: var(--teal);
    margin: 4px 0 10px;
  }
  h1{
    font-family:"Poppins", sans-serif;
    font-size: 21px;
    line-height:1.35;
    font-weight:600;
    margin: 0 0 26px;
    color: var(--ink);
  }

  /* ---------- Opções de resposta (só toque) ---------- */
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding: 15px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: #FAFBFA;
    font-family:"Inter", sans-serif;
    font-size:16px;
    font-weight:500;
    color: var(--ink);
    text-align:left;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease, transform .08s ease;
    min-height: 60px;
  }
  .opt:active{ transform: scale(0.98); }
  .opt .emoji{
    font-size:22px;
    width:30px;
    text-align:center;
    flex-shrink:0;
  }
  .opt.selected{
    border-color: var(--teal);
    background: linear-gradient(0deg, var(--amber-soft), var(--amber-soft)), #FAFBFA;
  }
  .opt:focus-visible{
    outline: 3px solid var(--teal);
    outline-offset: 2px;
  }

  /* ---------- Rodapé de confiança (Decisão 6) ---------- */
  .trust{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-top: 22px;
    padding: 13px 14px;
    background: #F1F6F3;
    border-radius: 12px;
    font-size: 12.5px;
    line-height:1.5;
    color: var(--ink-soft);
  }
  .trust svg{ flex-shrink:0; margin-top:1px; }

  /* ---------- Tela de status (envio / sucesso / erro / já respondido) ---------- */
  .status-screen{
    text-align:center;
    padding: 46px 24px;
  }
  .status-screen .icon{
    width:64px; height:64px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px;
  }
  .status-screen .icon.tone-teal{ background: var(--teal); }
  .status-screen .icon.tone-error{ background: var(--error); }
  .status-screen .icon.tone-amber{ background: var(--amber); }
  .status-screen h2{
    font-family:"Poppins", sans-serif;
    font-size:20px;
    margin: 0 0 8px;
  }
  .status-screen p{
    color: var(--ink-soft);
    font-size:14.5px;
    line-height:1.6;
    margin:0;
  }
  .status-screen .retry-btn{
    margin-top: 22px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 12px 22px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #fff;
    font-family:"Inter", sans-serif;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition: background .15s ease, transform .08s ease;
  }
  .status-screen .retry-btn:active{ transform: scale(0.98); }
  .status-screen .retry-btn:disabled{
    background: var(--ink-soft);
    cursor: default;
  }

  /* spinner simples para o estado "enviando" */
  .spinner{
    width:26px; height:26px;
    border-radius:50%;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .hidden{ display:none; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
    .spinner{ animation-duration: 1.6s; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Faydai<small>Pesquisa anônima de bem-estar</small></div>
    <div class="steps" id="steps"></div>
  </div>

  <div class="card" id="quizCard">
    <div class="dim" id="dim"></div>
    <h1 id="question"></h1>
    <div class="options" id="options"></div>

    <div class="trust">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F5C55" stroke-width="2">
        <path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3Z"/>
      </svg>
      <span>Sua resposta é anônima. O resultado só aparece agrupado por setor, e só quando um número mínimo de pessoas responder.</span>
    </div>
  </div>

  <!-- Cartão de status único: conteúdo trocado dinamicamente conforme o
       resultado do envio (enviando / sucesso / erro recuperável / já
       respondido). Fica escondido até finish() ser chamado. -->
  <div class="card status-screen hidden" id="statusCard">
    <div class="icon" id="statusIcon"></div>
    <h2 id="statusTitle"></h2>
    <p id="statusText"></p>
    <button type="button" class="retry-btn hidden" id="retryBtn">Tentar novamente</button>
  </div>
</div>

<script>
  // ---------- Perguntas (COPSOQ II-Br, versão curta — texto oficial preservado) ----------
  const QUESTIONS = [
    {
      dim: "Carga de trabalho",
      text: "Com que frequência você não consegue terminar suas tarefas no prazo?",
    },
    {
      dim: "Autonomia",
      text: "Com que frequência você tem liberdade para decidir como fazer seu trabalho?",
    },
    {
      dim: "Suporte da liderança",
      text: "Com que frequência seu superior direto está disposto a ouvir seus problemas de trabalho?",
    },
    {
      dim: "Insegurança",
      text: "Com que frequência você se preocupa em ficar desempregado(a)?",
    },
    {
      dim: "Esgotamento",
      text: "Com que frequência você se sente esgotado(a) emocionalmente por causa do trabalho?",
    },
  ];

  // Escala Likert oficial de 5 pontos — ícone + palavra, sem alterar o
  // significado das categorias.
  const SCALE = [
    { label: "Nunca",          emoji: "😄" },
    { label: "Raramente",      emoji: "🙂" },
    { label: "Às vezes",       emoji: "😐" },
    { label: "Frequentemente", emoji: "😟" },
    { label: "Sempre",         emoji: "😣" },
  ];

  let current = 0;
  const answers = new Array(QUESTIONS.length).fill(null);

  const stepsEl = document.getElementById("steps");
  const dimEl = document.getElementById("dim");
  const questionEl = document.getElementById("question");
  const optionsEl = document.getElementById("options");
  const quizCard = document.getElementById("quizCard");
  const statusCard = document.getElementById("statusCard");
  const statusIcon = document.getElementById("statusIcon");
  const statusTitle = document.getElementById("statusTitle");
  const statusText = document.getElementById("statusText");
  const retryBtn = document.getElementById("retryBtn");

  function renderSteps(){
    stepsEl.innerHTML = "";
    QUESTIONS.forEach((_, i) => {
      const s = document.createElement("div");
      s.className = "step" + (i < current ? " done" : i === current ? " current" : "");
      stepsEl.appendChild(s);
    });
  }

  function renderQuestion(){
    const q = QUESTIONS[current];
    dimEl.textContent = q.dim;
    questionEl.textContent = q.text;
    optionsEl.innerHTML = "";

    SCALE.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt";
      btn.innerHTML = `<span class="emoji">${opt.emoji}</span><span>${opt.label}</span>`;
      btn.addEventListener("click", () => selectAnswer(i));
      optionsEl.appendChild(btn);
    });

    renderSteps();
  }

  function selectAnswer(value){
    answers[current] = value;
    // feedback visual rápido antes de avançar sozinho — sem precisar de
    // um botão "próximo" separado.
    const buttons = optionsEl.querySelectorAll(".opt");
    buttons.forEach((b, i) => b.classList.toggle("selected", i === value));

    setTimeout(() => {
      if (current < QUESTIONS.length - 1) {
        current += 1;
        renderQuestion();
      } else {
        finish();
      }
    }, 260);
  }

  // ---------- Ícones (inline, sem depender de request externo) ----------
  const ICONS = {
    check: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>',
    warn:  '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
    info:  '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 16v-4M12 8h.01"/><circle cx="12" cy="12" r="9"/></svg>',
    spin:  '<div class="spinner"></div>',
  };

  // Troca o card da pergunta pelo card de status e preenche o conteúdo.
  // tone: 'teal' | 'error' | 'amber'  |  icon: chave em ICONS
  function showStatus({ tone, icon, title, text, showRetry }){
    quizCard.classList.add("hidden");
    statusCard.classList.remove("hidden");

    statusIcon.className = "icon tone-" + tone;
    statusIcon.innerHTML = ICONS[icon];
    statusTitle.textContent = title;
    statusText.textContent = text;
    retryBtn.classList.toggle("hidden", !showRetry);
  }

  function showSending(){
    showStatus({
      tone: "teal",
      icon: "spin",
      title: "Enviando suas respostas…",
      text: "Isso leva só um instante. Não feche esta página.",
      showRetry: false,
    });
  }

  function showSuccess(){
    showStatus({
      tone: "teal",
      icon: "check",
      title: "Respostas enviadas",
      text: "Obrigado por participar. Ninguém, nem a empresa, consegue saber qual foi a sua resposta individual.",
      showRetry: false,
    });
  }

  // Erro recuperável: rede caiu, servidor fora do ar, etc. As respostas
  // continuam em memória — o botão reenvia o mesmo payload.
  function showRetryableError(message){
    showStatus({
      tone: "error",
      icon: "warn",
      title: "Não foi possível enviar",
      text: message,
      showRetry: true,
    });
  }

  // Estado terminal: o link já foi usado antes. Não é um erro do
  // trabalhador nem algo que reenviar resolve — não mostra retry.
  function showAlreadySubmitted(){
    showStatus({
      tone: "amber",
      icon: "info",
      title: "Este link já foi usado",
      text: "Já existe uma resposta registrada com este acesso. Cada link só pode ser usado uma vez.",
      showRetry: false,
    });
  }

  // Link mal formado / código inválido — também não adianta tentar de novo.
  function showInvalidLink(){
    showStatus({
      tone: "error",
      icon: "warn",
      title: "Link inválido",
      text: "Este link de acesso não é válido ou expirou. Peça um novo link ao RH da sua empresa.",
      showRetry: false,
    });
  }

  async function finish(){
    // Modo demo: sem parâmetros de envio real na URL, só mostra sucesso.
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const orgId = params.get("org");
    const roundId = params.get("round");

    if (!code || !orgId || !roundId) {
      showSuccess();
      return;
    }

    await submit(code, orgId, roundId);
  }

  async function submit(code, orgId, roundId){
    showSending();
    retryBtn.disabled = true;

    let res;
    try {
      res = await fetch("/api/submit-response", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          orgId, roundId, code,
          answers: QUESTIONS.map((q, i) => ({ dimension: q.dim, value: answers[i] })),
        }),
      });
    } catch (e) {
      // fetch só rejeita em falha de rede/DNS/CORS — não em respostas
      // 4xx/5xx, que precisam ser checadas por res.ok abaixo.
      showRetryableError("Sem conexão com a internet. Verifique sua rede e tente novamente.");
      retryBtn.disabled = false;
      return;
    }

    if (res.ok) {
      showSuccess();
      return;
    }

    if (res.status === 409) {
      // Convite já usado (Decisão 5 — resposta é definitiva). Reenviar
      // não resolve nada, então não oferecemos retry.
      showAlreadySubmitted();
      return;
    }

    if (res.status === 404) {
      showInvalidLink();
      return;
    }

    // 400 (payload malformado), 500 (erro do servidor) e qualquer outro
    // código: tratamos como recuperável, já que reenviar pode funcionar.
    showRetryableError("Algo deu errado do nosso lado. Você pode tentar enviar de novo.");
    retryBtn.disabled = false;

    // guarda os últimos parâmetros para o botão de retry usar
    retryBtn.onclick = () => submit(code, orgId, roundId);
  }

  renderQuestion();
</script>

</body>
</html>
