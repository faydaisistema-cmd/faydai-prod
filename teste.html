<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste das funções</title>
<style>
  body { font-family: monospace; max-width: 700px; margin: 20px auto; padding: 0 12px; }
  h2 { margin-top: 40px; border-bottom: 1px solid #ccc; padding-bottom: 6px; }
  textarea { width: 100%; height: 100px; box-sizing: border-box; }
  input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { padding: 8px 16px; margin-top: 8px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; overflow-x: auto; white-space: pre-wrap; }
  label { font-size: 12px; color: #666; }
</style>
</head>
<body>

<h1>Teste das rotas /api</h1>
<p>Página só de teste — apagar depois que o frontend de verdade existir.</p>

<h2>1. importInvites</h2>
<label>Token de autenticação (deixe em branco se ainda não tiver login configurado)</label>
<input id="token1" placeholder="Bearer token (opcional por enquanto)">
<label>Corpo da requisição (JSON)</label>
<textarea id="body1">{
  "orgId": "org-teste",
  "roundId": "rodada-2026",
  "workers": [
    { "stableId": "matricula-001", "unitId": "operacoes" }
  ]
}</textarea>
<button onclick="testar('importInvites', 'token1', 'body1', 'out1')">Enviar POST</button>
<pre id="out1">(resultado aparece aqui)</pre>

<h2>2. submitResponse</h2>
<label>Corpo da requisição (JSON) — use um código real gerado pelo importInvites</label>
<textarea id="body2">{
  "orgId": "org-teste",
  "roundId": "rodada-2026",
  "code": "COLE_UM_CODIGO_AQUI",
  "answers": { "carga_trabalho": "às vezes" }
}</textarea>
<button onclick="testar('submitResponse', null, 'body2', 'out2')">Enviar POST</button>
<pre id="out2">(resultado aparece aqui)</pre>

<h2>3. computeAggregateReport</h2>
<label>Token de autenticação (deixe em branco se ainda não tiver login configurado)</label>
<input id="token3" placeholder="Bearer token (opcional por enquanto)">
<label>Corpo da requisição (JSON)</label>
<textarea id="body3">{
  "orgId": "org-teste",
  "roundId": "rodada-2026"
}</textarea>
<button onclick="testar('computeAggregateReport', 'token3', 'body3', 'out3')">Enviar POST</button>
<pre id="out3">(resultado aparece aqui)</pre>

<script>
async function testar(rota, tokenId, bodyId, outId) {
  const out = document.getElementById(outId);
  out.textContent = 'enviando...';

  const headers = { 'Content-Type': 'application/json' };
  if (tokenId) {
    const token = document.getElementById(tokenId).value.trim();
    if (token) headers['Authorization'] = 'Bearer ' + token;
  }

  let body;
  try {
    body = document.getElementById(bodyId).value;
    JSON.parse(body); // valida antes de enviar
  } catch (e) {
    out.textContent = 'ERRO: o JSON digitado está inválido.\n' + e.message;
    return;
  }

  try {
    const res = await fetch('/api/' + rota, { method: 'POST', headers, body });
    const text = await res.text();
    out.textContent = 'status: ' + res.status + '\n\n' + text;
  } catch (e) {
    out.textContent = 'ERRO de rede: ' + e.message;
  }
}
</script>

</body>
</html>
